<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="50%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#183b5e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="560" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Elegant Border -->
  <rect x="20" y="20" width="360" height="520" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="28" y="28" width="344" height="504" rx="8" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Corner Ornaments -->
  <path d="M 32 48 L 48 32 M 32 32 L 56 32 M 32 32 L 32 56" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 368 48 L 352 32 M 368 32 L 344 32 M 368 32 L 368 56" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 32 512 L 48 528 M 32 528 L 56 528 M 32 528 L 32 504" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 368 512 L 352 528 M 368 528 L 344 528 M 368 528 L 368 504" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Emblem Badge -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="70" fill="#0b192c" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="200" cy="200" r="58" fill="none" stroke="rgba(212,175,55,0.25)" stroke-dasharray="4,4" stroke-width="1.5" />
  </g>

  <!-- Open Book Icon -->
  <g transform="translate(160, 160) scale(0.16)" fill="url(#goldGrad)">
    <path d="M256 160c16-63.16 76.43-96 144-96 67.57 0 128 32.84 144 96v256c-16-63.16-76.43-96-144-96-67.57 0-128 32.84-144 96V160z" opacity="0.95"/>
    <path d="M256 160C240 96.84 179.57 64 112 64 44.43 64-16 96.84-32 160v256c16-63.16 76.43-96 144-96 67.57 0 128 32.84 144 96V160z"/>
    <path d="M256 160v256" stroke="#071224" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="200" y="320" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">
    DIGITAL LIBRARY
  </text>
  <text x="200" y="348" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3">
    ACADEMIC CATALOG
  </text>

  <!-- Divider Line -->
  <line x1="120" y1="375" x2="280" y2="375" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <text x="200" y="415" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">
    E-Book Circulation Portal
  </text>
  <text x="200" y="438" text-anchor="middle" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400">
    14-Day Lending &amp; Reference
  </text>

  <!-- Bottom Crest Badge -->
  <rect x="150" y="475" width="100" height="26" rx="13" fill="rgba(212,175,55,0.12)" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="492" text-anchor="middle" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">
    LIBRA
  </text>
</svg>
