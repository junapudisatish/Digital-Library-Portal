services:
  - type: web
    name: digital-library-portal
    runtime: python

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python create_superuser.py"

    startCommand: "python create_superuser.py && gunicorn library_portal.wsgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: WEB_CONCURRENCY
        value: "2"

      - key: DAILY_FINE_RATE
        value: "5.00"

      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"

      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admini!123"

      - key: EMAIL_BACKEND
        value: "library_portal.email_backends.BrevoEmailBackend"

      - key: BREVO_API_KEY
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false