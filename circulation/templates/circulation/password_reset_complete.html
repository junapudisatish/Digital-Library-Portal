{% extends "base.html" %}

{% block title %}Password Reset Complete | Digital Library Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="card shadow-lg border-0 rounded-4 text-center overflow-hidden">
                <div class="p-5">
                    <div class="d-inline-flex p-3 rounded-circle mb-3 bg-success bg-opacity-10 text-success">
                        <i class="bi bi-shield-check fs-1"></i>
                    </div>
                    <h3 class="fw-bold mb-2">Password Reset Successful</h3>
                    <p class="text-muted mb-4">
                        Your account password has been reset successfully. You can now sign in with your new credentials.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-navy px-4 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
